[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metabolic-intelligence-lab"
version = "0.1.0"
description = "System 0 / DUSE metabolic intelligence sandbox with salience, prospective memory, goal frontiers, CES/SDF-inspired reward, and experiment harnesses."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib", "pyyaml"]

[project.optional-dependencies]
notebooks = ["pandas", "jupyter"]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.coverage.run]
source = ["metabolic_intelligence_lab"]
omit = ["*/visualization/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["F", "E", "W"]
ignore = ["E501"]
